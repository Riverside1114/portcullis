name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The core is a proxy for other people's tooling. It has to behave identically
# on every platform an agent runs on, and stdio behaviour is exactly where
# platforms differ, so the matrix is not optional here.
jobs:
  core:
    name: core (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["20", "22"]

    defaults:
      run:
        working-directory: core

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: core/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check and build
        run: npm run build

      - name: Test
        run: npm test

  analyzer:
    name: analyzer (python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]

    defaults:
      run:
        working-directory: analyzer

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e .

      - name: Test
        run: python -m unittest discover -s tests -v

      # The rule packs are data. A pattern that no longer compiles would
      # otherwise only surface when it failed to fire on real traffic.
      - name: Rules load and compile
        run: python -m portcullis_analyzer rules
