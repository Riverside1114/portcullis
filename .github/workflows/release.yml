name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

# id-token is what makes provenance possible: npm exchanges this short lived
# OIDC token for an attestation binding the tarball to this workflow and commit.
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: publish to npm with provenance
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: core

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: core/package-lock.json

      - name: Install
        run: npm ci

      # Nothing gets published that has not passed the same suite as a pull
      # request. A release is the worst time to skip the tests.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check the tag matches package.json
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "publishing $pkg"

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Attach the tarball to the release
        if: github.event_name == 'release'
        run: |
          npm pack
          gh release upload "$GITHUB_REF_NAME" ./*.tgz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
