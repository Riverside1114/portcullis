[project]
name = "portcullis-analyzer"
version = "0.1.0"
description = "Result inspection for Portcullis: redacts credentials and flags prompt injection in MCP tool output."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Riverside1114" }]
keywords = ["mcp", "ai", "agent", "security", "prompt-injection", "secrets", "redaction"]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
portcullis-analyzer = "portcullis_analyzer.__main__:main"

[project.urls]
Homepage = "https://github.com/Riverside1114/portcullis"
Issues = "https://github.com/Riverside1114/portcullis/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["portcullis_analyzer"]

[tool.setuptools.package-data]
portcullis_analyzer = ["rules_data/*.yaml"]
