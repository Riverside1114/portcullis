# Credential patterns.
#
# These are high precision on purpose. A secret rule causes redaction, which
# changes what the model sees, so a false positive here silently corrupts a tool
# result. Prefer a pattern that is unmistakably a key over one that catches more.
#
# entropy: minimum Shannon entropy in bits per character for the captured group.
# Use it on generic patterns; vendor prefixed keys do not need it.

version: 1
kind: secrets

rules:
  - id: aws-access-key
    name: AWS access key id
    severity: critical
    pattern: '\b((?:AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16})\b'

  - id: aws-secret-key
    name: AWS secret access key
    severity: critical
    pattern: '(?i)aws_?secret_?access_?key["\s:=]+["'']?([A-Za-z0-9/+=]{40})'
    entropy: 4.0

  - id: github-token
    name: GitHub token
    severity: critical
    pattern: '\b(gh[pousr]_[A-Za-z0-9]{36,255})\b'

  - id: github-fine-grained
    name: GitHub fine grained token
    severity: critical
    pattern: '\b(github_pat_[A-Za-z0-9_]{22,255})\b'

  - id: openai-key
    name: OpenAI API key
    severity: critical
    pattern: '\b(sk-(?:proj-)?[A-Za-z0-9_-]{20,})\b'

  - id: anthropic-key
    name: Anthropic API key
    severity: critical
    pattern: '\b(sk-ant-[A-Za-z0-9_-]{20,})\b'

  - id: slack-token
    name: Slack token
    severity: high
    pattern: '\b(xox[baprs]-[A-Za-z0-9-]{10,})\b'

  - id: google-api-key
    name: Google API key
    severity: high
    pattern: '\b(AIza[0-9A-Za-z_-]{35})\b'

  - id: stripe-key
    name: Stripe live key
    severity: critical
    pattern: '\b((?:sk|rk)_live_[A-Za-z0-9]{20,})\b'

  - id: npm-token
    name: npm access token
    severity: critical
    pattern: '\b(npm_[A-Za-z0-9]{36})\b'

  - id: private-key
    name: Private key block
    severity: critical
    pattern: '(-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----[\s\S]{0,8000}?-----END (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----)'

  - id: jwt
    name: JSON web token
    severity: medium
    pattern: '\b(eyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,})\b'

  - id: postgres-url
    name: Database URL with a password
    severity: high
    pattern: '\b((?:postgres|postgresql|mysql|mongodb(?:\+srv)?|redis|amqp)://[^\s:@/]+:[^\s:@/]+@[^\s/]+)'

  # The catch all. Gated on entropy because "token: example" is not a secret and
  # redacting it would be worse than missing a real one.
  - id: generic-assignment
    name: High entropy value assigned to a secret shaped name
    severity: medium
    pattern: '(?i)\b(?:api[_-]?key|secret[_-]?key|access[_-]?token|auth[_-]?token|client[_-]?secret|password|passwd)["\s:=]+["'']?([A-Za-z0-9/+_=-]{24,})'
    entropy: 3.6
